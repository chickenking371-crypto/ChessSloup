<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Šachový kroužek ChessSloup</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --primary: #2c3e50;
            --accent: #27ae60;
            --danger: #e74c3c;
            --text: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h1, h2, h3 { color: var(--primary); }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th { background-color: #f8f9fa; }

        input, select, button {
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 8px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { opacity: 0.9; }
        .btn-danger { background-color: var(--danger); }
        .btn-accent { background-color: var(--accent); }

        .admin-only { display: none; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>♟️ Šachový kroužek</h1>
        <div id="auth-status">
            <button onclick="toggleAuthModal()" style="width: auto;">Přihlášení Admin</button>
        </div>
    </header>

    <!-- Modal pro přihlášení -->
    <div id="auth-modal" class="card" style="display: none;">
        <h3>Přihlášení pro učitele (Admin)</h3>
        <input type="email" id="admin-email" placeholder="Email">
        <input type="password" id="admin-password" placeholder="Heslo">
        <button onclick="login()">Přihlásit se</button>
        <p id="auth-error" style="color: red;"></p>
    </div>

    <!-- ADMIN PANEL -->
    <div id="admin-panel" class="card admin-only" style="border: 2px solid var(--accent);">
        <h2>⚙️ Admin Panel</h2>
        <div class="grid-2">
            <!-- Přidání hráče -->
            <div>
                <h3>Přidat nového hráče</h3>
                <input type="text" id="new-player-name" placeholder="Jméno a příjmení">
                <button class="btn-accent" onclick="addPlayer()">Přidat hráče</button>
            </div>

            <!-- Zapsání zápasu -->
            <div>
                <h3>Zapsat nový zápas</h3>
                
                <label for="match-white">⚪ Bílý hráč:</label>
                <select id="match-white"><option value="">Vyber bílého hráče...</option></select>
                
                <label for="match-black">⬛ Černý hráč:</label>
                <select id="match-black"><option value="">Vyber černého hráče...</option></select>
                
                <label for="match-result">Výsledek zápasu:</label>
                <select id="match-result">
                    <option value="white">Výhra Bílého (Bílý +30b / Černý -30b)</option>
                    <option value="black">Výhra Černého (Černý +30b / Bílý -30b)</option>
                    <option value="draw">Remíza (+10b pro oba)</option>
                </select>
                
                <button class="btn-accent" onclick="addMatch()" style="margin-top: 15px;">Uložit zápas</button>
            </div>
        </div>
    </div>

    <!-- ŽEBŘÍČEK -->
    <div class="card">
        <h2>🏆 Žebříček hráčů</h2>
        <table>
            <thead>
                <tr>
                    <th>Pořadí</th>
                    <th>Jméno</th>
                    <th>Průměr b./zápas</th>
                    <th>Celkem bodů</th>
                    <th>Odehrané zápasy</th>
                    <th class="admin-only">Akce Admin</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <tr><td colspan="6">Načítám data...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- HISTORIE ZÁPASŮ -->
    <div class="card">
        <div class="card-header">
            <h2>📜 Historie zápasů</h2>
            <button onclick="clearHistory()" class="btn-danger admin-only" style="width: auto; padding: 6px 12px;">🗑️ Smazat celou historii</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Datum</th>
                    <th>⚪ Bílý hráč</th>
                    <th>⬛ Černý hráč</th>
                    <th>Výsledek</th>
                </tr>
            </thead>
            <tbody id="history-body">
                <tr><td colspan="4">Načítám data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCw4a_nCpYMwYrXRjWHwUe8E41HTY7blis",
        authDomain: "chesoup-78039.firebaseapp.com",
        projectId: "chesoup-78039",
        storageBucket: "chesoup-78039.firebasestorage.app",
        messagingSenderId: "746564297487",
        appId: "1:746564297487:web:e5d85ce6c0f8b54e4ad47a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let isAdmin = false;

    // Kontrola přihlášení uživatele
    onAuthStateChanged(auth, (user) => {
        if (user) {
            isAdmin = true;
            document.getElementById('auth-status').innerHTML = `<button class="btn-danger" onclick="logout()" style="width: auto;">Odhlásit (${user.email})</button>`;
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            document.getElementById('auth-modal').style.display = 'none';
        } else {
            isAdmin = false;
            document.getElementById('auth-status').innerHTML = `<button onclick="toggleAuthModal()" style="width: auto;">Přihlášení Admin</button>`;
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
        }
        loadData();
    });

    // Přihlášení
    window.login = async () => {
        const email = document.getElementById('admin-email').value;
        const pass = document.getElementById('admin-password').value;
        try {
            await signInWithEmailAndPassword(auth, email, pass);
            document.getElementById('auth-error').innerText = "";
        } catch (err) {
            document.getElementById('auth-error').innerText = "Chyba přihlášení: " + err.message;
        }
    };

    // Odhlášení
    window.logout = () => signOut(auth);

    window.toggleAuthModal = () => {
        const modal = document.getElementById('auth-modal');
        modal.style.display = modal.style.display === 'none' ? 'block' : 'none';
    };

    // Načtení dat z databáze
    async function loadData() {
        // 1. Načíst hráče
        const playersSnapshot = await getDocs(collection(db, "players"));
        let playersList = [];

        playersSnapshot.forEach((docSnap) => {
            const p = docSnap.data();
            const id = docSnap.id;
            const matches = p.matchesPlayed || 0;
            const points = p.points || 0;
            const avgPoints = matches > 0 ? (points / matches) : 0;

            playersList.push({
                id: id,
                name: p.name,
                points: points,
                matchesPlayed: matches,
                avgPoints: avgPoints
            });
        });

        // 🏆 ŘAZENÍ: Primárně podle průměru bodů -> Při shodě rozhodují celkové body
        playersList.sort((a, b) => {
            if (Math.abs(b.avgPoints - a.avgPoints) < 0.0001) {
                return b.points - a.points;
            }
            return b.avgPoints - a.avgPoints;
        });

        let leaderboardHtml = "";
        let playerOptionsHtml = '<option value="">Vyber hráče...</option>';
        let rank = 1;

        playersList.forEach((p) => {
            leaderboardHtml += `
                <tr>
                    <td><strong>${rank++}.</strong></td>
                    <td>${p.name}</td>
                    <td><strong>${p.avgPoints.toFixed(1)} b./zápas</strong></td>
                    <td>${p.points} b.</td>
                    <td>${p.matchesPlayed}</td>
                    <td class="admin-only" style="display: ${isAdmin ? 'table-cell' : 'none'}">
                        <button onclick="editStats('${p.id}', ${p.points}, ${p.matchesPlayed})" style="width:auto; padding:3px 8px;">✏️ Upravit</button>
                        <button onclick="deletePlayer('${p.id}')" class="btn-danger" style="width:auto; padding:3px 8px;">✕</button>
                    </td>
                </tr>
            `;

            playerOptionsHtml += `<option value="${p.id}">${p.name} (${p.avgPoints.toFixed(1)} b./zápas)</option>`;
        });

        document.getElementById('leaderboard-body').innerHTML = leaderboardHtml || "<tr><td colspan='6'>Zatím žádní hráči.</td></tr>";
        document.getElementById('match-white').innerHTML = playerOptionsHtml;
        document.getElementById('match-black').innerHTML = playerOptionsHtml;

        // 2. Načíst historii
        const qMatches = query(collection(db, "matches"), orderBy("createdAt", "desc"));
        const matchesSnapshot = await getDocs(qMatches);
        let historyHtml = "";

        matchesSnapshot.forEach((docSnap) => {
            const m = docSnap.data();
            let resultText = "Remíza (+10b oběma)";
            if (m.result === 'white') resultText = `Výhra: ⚪ ${m.whiteName}`;
            if (m.result === 'black') resultText = `Výhra: ⬛ ${m.blackName}`;

            const date = m.createdAt ? new Date(m.createdAt.toDate()).toLocaleDateString('cs-CZ') : 'Dnes';

            historyHtml += `
                <tr>
                    <td>${date}</td>
                    <td>⚪ ${m.whiteName}</td>
                    <td>⬛ ${m.blackName}</td>
                    <td><strong>${resultText}</strong></td>
                </tr>
            `;
        });

        document.getElementById('history-body').innerHTML = historyHtml || "<tr><td colspan='4'>Zatím žádné odehrané zápasy.</td></tr>";
    }

    // Přidat hráče
    window.addPlayer = async () => {
        const nameInput = document.getElementById('new-player-name');
        if (!nameInput.value.trim()) return alert("Zadej jméno hráče");

        await addDoc(collection(db, "players"), {
            name: nameInput.value.trim(),
            points: 0,
            matchesPlayed: 0
        });

        nameInput.value = "";
        loadData();
    };

    // Zapsat zápas + přepočet bodů (+30 / -30 / +10)
    window.addMatch = async () => {
        const whiteSelect = document.getElementById('match-white');
        const blackSelect = document.getElementById('match-black');
        const result = document.getElementById('match-result').value;

        if (!whiteSelect.value || !blackSelect.value) return alert("Vyber oba hráče!");
        if (whiteSelect.value === blackSelect.value) return alert("Hráč nemůže hrát sám se sebou!");

        const whiteName = whiteSelect.options[whiteSelect.selectedIndex].text.split(' (')[0];
        const blackName = blackSelect.options[blackSelect.selectedIndex].text.split(' (')[0];

        // Uložit zápas
        await addDoc(collection(db, "matches"), {
            whiteId: whiteSelect.value,
            whiteName: whiteName,
            blackId: blackSelect.value,
            blackName: blackName,
            result: result,
            createdAt: serverTimestamp()
        });

        // Úprava bodů a zápasů
        const playersSnapshot = await getDocs(collection(db, "players"));
        playersSnapshot.forEach(async (docSnap) => {
            const p = docSnap.data();
            const isWhite = docSnap.id === whiteSelect.value;
            const isBlack = docSnap.id === blackSelect.value;

            if (isWhite || isBlack) {
                let pointChange = 0;

                if (result === 'draw') {
                    pointChange = 10;
                } else if (result === 'white') {
                    pointChange = isWhite ? 30 : -30;
                } else if (result === 'black') {
                    pointChange = isBlack ? 30 : -30;
                }

                await updateDoc(doc(db, "players", docSnap.id), {
                    points: (p.points || 0) + pointChange,
                    matchesPlayed: (p.matchesPlayed || 0) + 1
                });
            }
        });

        setTimeout(loadData, 500);
    };

    // Ruční úprava bodů i zápasů pro Admina
    window.editStats = async (id, currentPoints, currentMatches) => {
        const newPoints = prompt("Zadej celkový počet BODŮ:", currentPoints);
        if (newPoints === null) return;

        const newMatches = prompt("Zadej celkový počet ODEHRANÝCH ZÁPASŮ:", currentMatches);
        if (newMatches === null) return;

        await updateDoc(doc(db, "players", id), {
            points: parseInt(newPoints) || 0,
            matchesPlayed: parseInt(newMatches) || 0
        });

        loadData();
    };

    // Smazat hráče
    window.deletePlayer = async (id) => {
        if (confirm("Opravdu chceš smazat tohoto hráče?")) {
            await deleteDoc(doc(db, "players", id));
            loadData();
        }
    };

    // Smazat celou historii zápasů
    window.clearHistory = async () => {
        if (confirm("Opravdu chceš SMAZAT CELOU HISTORII zápasů?")) {
            const matchesSnapshot = await getDocs(collection(db, "matches"));
            matchesSnapshot.forEach(async (docSnap) => {
                await deleteDoc(doc(db, "matches", docSnap.id));
            });
            setTimeout(loadData, 500);
        }
    };
</script>
</body>
</html>
